name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - os: macos-14
            rust_target: aarch64-apple-darwin
          - os: macos-13
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.rust_target }}

      - name: Linux deps (gtk, webkit, etc)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Rust fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --target ${{ matrix.rust_target }} -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.rust_target }}

      - name: Tauri build (no bundle)
        run: pnpm tauri build --target ${{ matrix.rust_target }} --no-bundle
