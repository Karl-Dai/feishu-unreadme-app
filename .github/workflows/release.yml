name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rust_target: aarch64-apple-darwin
            label: macos-arm64
            extra_args: ''
          - os: macos-15-intel
            rust_target: x86_64-apple-darwin
            label: macos-x64
            extra_args: ''
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            label: linux-x64
            extra_args: '--bundles deb,rpm'  # AppImage 远程下载 linuxdeploy/apprun 在 GHA 极不稳定,跳过
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            label: windows-x64
            extra_args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_BODY_EOF'
            node scripts/extract-changelog-section.mjs "${{ github.ref_name }}"
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust_target }} ${{ matrix.extra_args }}
